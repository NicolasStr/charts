apiVersion: v2
name: twenty
description: A Helm chart for Kubernetes

type: application

version: 0.1.0

appVersion: "0.50.0"

dependencies:
- name: postgresql
  repository: "oci://registry-1.docker.io/bitnamicharts"
  version: 16.6.0
  condition: postgresql.enabled
- name: redis
  repository: "oci://registry-1.docker.io/bitnamicharts"
  version: 20.11.4
  condition: redis.enabled
- name: minio
  repository: "oci://registry-1.docker.io/bitnamicharts"
  version: 16.0.2
  condition: minio.enabled