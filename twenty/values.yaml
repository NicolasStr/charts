replicaCount: 1

image:
  repository: twentycrm/twenty
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

twenty:
  # Port to use for listening HTTP requests by the container
  port: 3000
  # If Ingress is disabled, configure this URL as the server URL
  # serverUrl: "toto.fr"
  # Inline env to add to Pods.
  # Value can be of type string, with directly the value of the key, or an object (in that case, the key is used as "-name: $key")
  env:
    TELEMETRY_ENABLED: "false"
  #  APP_SECRET2: "test2"
  #  APP_SECRET:
  #    valueFrom:
  #      configMap: "test"
  # APP_SECRET: "this-is-not-secret"
  envFromConfigMapName: ""
  envFromSecretName: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: chart-example.local
  path: /
  pathType: Prefix
  tlsSecretName: "chart-example-tls"

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

postgresql:
  enabled: true

redis:
  enabled: true
  architecture: standalone

minio:
  enabled: true
  disableWebUI: true
  defaultBuckets: "twenty"